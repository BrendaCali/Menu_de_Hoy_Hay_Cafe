<style>
  :root {
    --leather: #4a3d33;
    --leather-dark: #372c24;
    --paper: #fbf8f1;
    --paper-edge: #efe7d6;
    --ink: #3a2c22;
    --ink-soft: #7a6a5b;
    --gold: #b08d57;
    --sage: #8a9a6a;
    --rose: #c98a86;
    --honey: #e2b86a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(255,255,255,.08), transparent 60%),
      repeating-radial-gradient(circle at 20% 30%, rgba(255,255,255,.015) 0 2px, transparent 2px 5px),
      var(--leather);
    color: var(--ink);
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 17px;
    line-height: 1.3;
    padding: 0 16px 40px;
  }

  /* ---------- barra de secciones ---------- */
  .tabs {
    position: sticky; top: 0; z-index: 10;
    margin: 0 -16px 22px;
    padding: 12px 16px;
    background: rgba(55,44,36,.94);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid rgba(255,255,255,.08);
    display: flex; gap: 8px; justify-content: center; align-items: center;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    flex: 0 0 auto;
    font: 600 12px/1 "Cinzel", serif; letter-spacing: .12em; text-transform: uppercase;
    color: #e9dfcf; background: transparent;
    border: 1px solid rgba(233,223,207,.28); border-radius: 999px;
    padding: 10px 16px; cursor: pointer; transition: .2s;
  }
  .tabs button:hover { border-color: var(--honey); color: #fff; }
  .tabs button[aria-current="page"] { background: var(--paper); color: var(--ink); border-color: var(--paper); }
  .tabs .home { padding: 8px 10px; display: grid; place-items: center; }
  .tabs .home svg { width: 18px; height: 18px; }

  /* ---------- hoja ---------- */
  main { max-width: 980px; margin: 0 auto; }
  .sheet {
    display: none;
    position: relative; overflow: hidden;
    background:
      repeating-linear-gradient(45deg, rgba(120,100,70,.025) 0 1px, transparent 1px 6px),
      var(--paper);
    border-radius: 6px;
    padding: 46px clamp(22px, 5vw, 58px) 34px;
    box-shadow: 0 1px 0 #fff inset, 0 24px 50px rgba(0,0,0,.38), 0 2px 6px rgba(0,0,0,.25);
  }
  .sheet::before { /* marco fino */
    content: ""; position: absolute; inset: 12px; pointer-events: none;
    border: 1px solid rgba(176,141,87,.45); border-radius: 3px;
  }
  .sheet.active { display: block; animation: turn .45s ease both; }
  @keyframes turn { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }

  .wash { /* acuarela suave en las esquinas */
    position: absolute; border-radius: 50%; filter: blur(34px); opacity: .32; pointer-events: none;
  }
  .wash.a { width: 280px; height: 280px; top: -90px; right: -70px; }
  .wash.b { width: 240px; height: 240px; bottom: -80px; left: -70px; }

  .sheet > * { position: relative; }

  .title { text-align: center; margin-bottom: 8px; }
  .title h1 {
    font: 600 clamp(26px, 5vw, 40px)/1.1 "Cinzel", serif;
    letter-spacing: .04em; font-variant: small-caps; text-transform: none;
    color: var(--ink);
  }
  .orn { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px auto 26px; color: var(--gold); }
  .orn::before, .orn::after { content: ""; height: 1px; width: min(120px, 22vw); background: linear-gradient(90deg, transparent, var(--gold)); }
  .orn::after { transform: scaleX(-1); }
  .orn svg { width: 22px; height: 22px; }

  .note {
    text-align: center; margin: -12px 0 24px;
    font: 600 12px/1 "Cinzel", serif; letter-spacing: .14em; text-transform: uppercase; color: var(--gold);
  }
  .note span { border: 1px solid var(--gold); border-radius: 999px; padding: 7px 14px; display: inline-block; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 54px; }
  .group { margin-bottom: 20px; }
  .group.wide { grid-column: 1 / -1; }
  .group h2 {
    font: 600 clamp(18px, 3vw, 22px)/1.1 "Cinzel", serif; font-variant: small-caps;
    letter-spacing: .05em; color: var(--ink);
    padding-bottom: 8px; margin-bottom: 12px;
    border-bottom: 1px solid rgba(176,141,87,.5);
    display: flex; align-items: baseline; gap: 10px;
  }
  .group h2 small { font: italic 500 15px "Cormorant Garamond", serif; color: var(--ink-soft); letter-spacing: 0; font-variant: normal; }
  .list { list-style: none; }
  .group.wide .list { columns: 2; column-gap: 54px; }
  .item { break-inside: avoid; padding: 6px 0 7px; }
  .row { display: flex; align-items: baseline; gap: 8px; }
  .row .name { font: 700 17px/1.2 "Cormorant Garamond", serif; color: var(--ink); }
  .row .dots { flex: 1; min-width: 14px; border-bottom: 2px dotted rgba(122,106,91,.5); transform: translateY(-3px); }
  .row .price { font: 700 17px/1 "Cinzel", serif; color: var(--ink); white-space: nowrap; }
  .desc { font-size: 15.5px; color: var(--ink-soft); margin-top: 2px; max-width: 94%; }
  .tag { font: 600 10px/1 "Cinzel", serif; letter-spacing: .06em; text-transform: uppercase; color: var(--sage); border: 1px solid currentColor; border-radius: 99px; padding: 3px 7px; margin-left: 6px; vertical-align: 2px; white-space: nowrap; }

  .flavors { font: 600 15px/1.5 "Cinzel", serif; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); margin-top: 6px; }
  .flavors-title { font: italic 500 15px "Cormorant Garamond", serif; color: var(--ink-soft); margin-top: 14px; }
  .juices { color: var(--ink-soft); font-size: 16.5px; margin-bottom: 10px; }

  /* pie de hoja y navegación */
  .foot {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 26px; padding-top: 16px; border-top: 1px solid rgba(176,141,87,.4);
  }
  .foot .mini { font: 800 13px/1 "Montserrat", sans-serif; letter-spacing: .02em; color: var(--ink); }
  .foot .mini em { font: 400 15px "Pacifico", cursive; color: var(--gold); margin-left: 4px; font-style: normal; }
  .nav button {
    font: 600 12px/1 "Cinzel", serif; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink); background: transparent; border: 1px solid rgba(58,44,34,.35);
    border-radius: 999px; padding: 10px 16px; cursor: pointer; transition: .2s;
  }
  .nav button:hover { background: var(--ink); color: var(--paper); }
  .nav { display: flex; gap: 8px; }

  /* ---------- portada ---------- */
  .cover { text-align: center; padding: 56px clamp(22px,5vw,58px) 44px; }
  .logo {
    width: 190px; height: 190px; margin: 6px auto 12px; position: relative;
    border: 8px solid var(--ink); display: grid; place-items: center; background: var(--paper);
  }
  .logo b { font: 800 56px/.92 "Montserrat", sans-serif; letter-spacing: -.01em; color: var(--ink); text-align: left; display: block; }
  .logo em { position: absolute; right: -8px; bottom: -22px; background: var(--paper); padding: 0 10px 0 12px; font: 400 26px/1 "Pacifico", cursive; font-style: normal; color: var(--ink); }
  .cover .sub { margin-top: 34px; font: 500 13px/1 "Cinzel", serif; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); }
  .cover h1 { font: 600 clamp(28px,6vw,44px)/1.1 "Cinzel", serif; font-variant: small-caps; margin: 14px 0 4px; letter-spacing: .05em; }
  .index { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 30px; text-align: left; }
  .index button {
    display: flex; align-items: center; gap: 14px; text-align: left; cursor: pointer;
    background: rgba(255,255,255,.55); border: 1px solid rgba(176,141,87,.5); border-radius: 4px;
    padding: 16px 18px; color: var(--ink); transition: .2s;
  }
  .index button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,.12); background: #fff; }
  .index svg { width: 30px; height: 30px; flex: 0 0 auto; color: var(--gold); }
  .index span { font: 600 17px/1.15 "Cinzel", serif; font-variant: small-caps; letter-spacing: .04em; }
  .index small { display: block; font: italic 500 14px "Cormorant Garamond", serif; color: var(--ink-soft); font-variant: normal; letter-spacing: 0; margin-top: 3px; }

  @media (max-width: 720px) {
    body { font-size: 16px; }
    .sheet { padding: 38px 20px 26px; }
    .grid { grid-template-columns: 1fr; }
    .group.wide .list { columns: 1; }
    .desc { max-width: 100%; }
    .foot { flex-direction: column-reverse; }
    .tabs { justify-content: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) { .sheet.active { animation: none; } }
</style>
</head>

/* ============================================================

const ORN = ICONS.leaf;
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function itemHTML([name, price, desc, tag]) {
  return `<li class="item">
    <div class="row"><span class="name">${esc(name)}${tag ? `<span class="tag">${esc(tag)}</span>` : ''}</span><span class="dots"></span><span class="price">${esc(price)}</span></div>
    ${desc ? `<p class="desc">${esc(desc)}</p>` : ''}
  </li>`;
}

function groupHTML(g) {
  const flavors = g.flavors ? (g.juices
      ? `<p class="juices">${g.flavors.map(esc).join(' · ')}</p>`
      : `${g.flavorsTitle ? `<p class="flavors-title">${esc(g.flavorsTitle)}</p>` : ''}<p class="flavors">${g.flavors.map(esc).join('<br>')}</p>`) : '';
  return `<section class="group${g.wide ? ' wide' : ''}">
    <h2>${esc(g.h)}</h2>
    ${g.juices ? flavors : ''}
    <ul class="list">${g.items.map(itemHTML).join('')}</ul>
    ${g.juices ? '' : flavors}
  </section>`;
}

const main = document.getElementById('main');
const tabs = document.getElementById('tabs');
const order = ['inicio', ...PAGES.map(p => p.id)];

function footHTML(i) {
  const prev = order[i-1], next = order[i+1];
  const label = id => id === 'inicio' ? 'Inicio' : PAGES.find(p => p.id === id).short;
  return `<div class="foot">
    <div class="mini">HOY HAY<em>Café</em></div>
    <div class="nav">
      ${prev ? `<button data-go="${prev}">← ${label(prev)}</button>` : ''}
      ${next ? `<button data-go="${next}">${label(next)} →</button>` : ''}
    </div>
  </div>`;
}

    ${PAGES.map(p => `<button data-go="${p.id}">${ICONS[p.icon]}<span>${esc(p.title)}<small>${esc(p.sub)}</small></span></button>`).join('')}
  </div>
  <div class="foot" style="justify-content:center"><div class="mini">HOY HAY<em>Café</em></div></div>
</article>`);

// Hojas
PAGES.forEach((p, i) => {
  main.insertAdjacentHTML('beforeend', `
  <article class="sheet" id="p-${p.id}">
    <span class="wash a" style="background:${p.washes[0]}"></span><span class="wash b" style="background:${p.washes[1]}"></span>
    <header class="title"><h1>${esc(p.title)}</h1></header>
    <div class="orn">${ICONS[p.icon]}</div>
    ${p.note ? `<p class="note"><span>${esc(p.note)}</span></p>` : ''}
    <div class="grid">${p.cols
      ? p.cols.map(c => `<div class="stack">${c.map(k => groupHTML(p.groups[k])).join('')}</div>`).join('')
      : p.groups.map(groupHTML).join('')}</div>
    ${footHTML(i + 1)}
  </article>`);
});

// Barra superior
tabs.insertAdjacentHTML('beforeend',
  `<button class="home" data-go="inicio" aria-label="Inicio">${ICONS.home}</button>` +
  PAGES.map(p => `<button data-go="${p.id}">${esc(p.short)}</button>`).join(''));

/* ---------- navegación: una hoja a la vez ---------- */
function show(id, push = true) {
  if (!order.includes(id)) id = 'inicio';
  document.querySelectorAll('.sheet').forEach(s => s.classList.toggle('active', s.id === 'p-' + id));
  tabs.querySelectorAll('button').forEach(b => { if (b.dataset.go === id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  const cur = tabs.querySelector('[aria-current]'); if (cur) cur.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (push) { try { history.replaceState(null, '', '#' + id); } catch (e) {} }
  current = id;
}
let current = 'inicio';
document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) show(b.dataset.go); });
window.addEventListener('hashchange', () => show(location.hash.slice(1), false));
document.addEventListener('keydown', e => {
  const i = order.indexOf(current);
  if (e.key === 'ArrowRight' && order[i+1]) show(order[i+1]);
  if (e.key === 'ArrowLeft' && order[i-1]) show(order[i-1]);
});
// deslizar en el celular
let x0 = null;
document.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0; x0 = null;
  const i = order.indexOf(current);
  if (Math.abs(dx) > 70) { if (dx < 0 && order[i+1]) show(order[i+1]); if (dx > 0 && order[i-1]) show(order[i-1]); }
}, { passive: true });

show(location.hash.slice(1) || 'inicio', false);
</script>
</body>
