<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoy Hay Café · Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --leather: #4b3d34;
    --leather-dark: #372c24;
    --paper: #fbf9f4;
    --ink: #3a2c22;
    --ink-soft: #6f6053;
    --gold: #b08d57;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(255,255,255,.08), transparent 60%),
      var(--leather);
    color: var(--ink);
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 17px; line-height: 1.3;
    padding: 0 16px 40px;
  }

  /* ---------- barra de secciones ---------- */
  .tabs {
    position: sticky; top: 0; z-index: 10;
    margin: 0 -16px 22px; padding: 12px 16px;
    background: rgba(55,44,36,.95); backdrop-filter: blur(6px);
    border-bottom: 1px solid rgba(255,255,255,.08);
    display: flex; gap: 8px; justify-content: center; align-items: center;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    flex: 0 0 auto; cursor: pointer; transition: .2s;
    font: 600 12px/1 "Cinzel", serif; letter-spacing: .12em; text-transform: uppercase;
    color: #e9dfcf; background: transparent;
    border: 1px solid rgba(233,223,207,.28); border-radius: 999px; padding: 10px 16px;
  }
  .tabs button:hover { border-color: #e2b86a; color: #fff; }
  .tabs button[aria-current="page"] { background: var(--paper); color: var(--ink); border-color: var(--paper); }
  .tabs .home { padding: 8px 10px; display: grid; place-items: center; }
  .tabs .home svg { width: 18px; height: 18px; }

  /* ---------- hoja ---------- */
  main { max-width: 1000px; margin: 0 auto; }
  .sheet {
    display: none; position: relative; overflow: hidden;
    background: var(--paper);
    border-radius: 4px;
    padding: 44px clamp(20px, 4.5vw, 56px) 30px;
    box-shadow: 0 24px 50px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.25);
  }
  .sheet.active { display: block; animation: turn .45s ease both; }
  @keyframes turn { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }

  .title { text-align: center; margin-bottom: 6px; }
  .title.left { text-align: left; }
  .title h1 { font: 600 clamp(28px, 5.2vw, 42px)/1.1 "Cinzel", serif; font-variant: small-caps; letter-spacing: .03em; }
  .title .sub { font: 600 15px/1 "Cinzel", serif; letter-spacing: .08em; color: var(--ink-soft); margin-top: 10px; }
  .orn { display: flex; justify-content: center; margin: 8px auto 22px; color: var(--gold); }
  .orn svg { width: 26px; height: 26px; }
  .orn.none { display: none; }

  /* filas de la hoja: texto + ilustraciones, como en el menú */
  .r { display: grid; gap: 14px 30px; align-items: center; margin-bottom: 12px; }
  .r.top { align-items: start; }
  .r figure { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  img { max-width: 100%; height: auto; display: block; mix-blend-mode: multiply; }

  .group h2 {
    font: 600 clamp(19px, 3vw, 24px)/1.1 "Cinzel", serif; font-variant: small-caps; letter-spacing: .04em;
    margin-bottom: 10px;
  }
  .group h2.line { padding-bottom: 6px; border-bottom: 1px solid rgba(176,141,87,.45); }
  .list { list-style: none; }
  .list.two { columns: 2; column-gap: 40px; }
  .item { break-inside: avoid; padding: 4px 0 6px; }
  .row { display: flex; align-items: baseline; gap: 6px; }
  .row .name { font: 700 17px/1.2 "Cormorant Garamond", serif; }
  .row .dots { flex: 1; min-width: 12px; border-bottom: 2px dotted rgba(111,96,83,.55); transform: translateY(-3px); }
  .row .price { font: 700 16px/1 "Cinzel", serif; white-space: nowrap; }
  .desc { font-size: 15px; color: var(--ink-soft); margin-top: 1px; }
  .tag { font: 600 9.5px/1 "Cinzel", serif; letter-spacing: .05em; text-transform: uppercase; color: #6d7f4a; border: 1px solid currentColor; border-radius: 99px; padding: 3px 6px; margin-left: 6px; vertical-align: 2px; white-space: nowrap; }
  .tight .item { padding: 2px 0 3px; }

  .flavors { font: 600 14px/1.6 "Cinzel", serif; letter-spacing: .08em; text-transform: uppercase; margin-top: 8px; }
  .flavors-title { font: italic 600 16px "Cormorant Garamond", serif; color: var(--ink-soft); margin-top: 12px; }
  .juices { color: var(--ink-soft); font-size: 16px; margin-bottom: 8px; }

  /* mosaicos y composiciones de imágenes */
  .zig { display: flex; flex-direction: column; gap: 6px; }
  .zig figure { align-items: flex-start; }
  .zig figure.rt { align-items: flex-end; }
  .zig figcaption, .cap { font: 600 13px/1 "Cinzel", serif; font-variant: small-caps; letter-spacing: .05em; color: var(--ink); }
  .c4 { display: grid; grid-template-columns: auto auto auto; gap: 0 8px; align-items: center; justify-items: center; }
  .c4 .a { grid-row: span 2; }
  .c4 .c { grid-row: span 2; }
  .mosaic { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; align-items: center; }

  /* pie y navegación */
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(176,141,87,.4); }
  .foot .mini { font: 800 13px/1 "Montserrat", "Arial Black", sans-serif; }
  .foot .mini em { font: italic 600 15px "Cormorant Garamond", serif; color: var(--gold); margin-left: 4px; }
  .nav { display: flex; gap: 8px; }
  .nav button { font: 600 12px/1 "Cinzel", serif; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); background: transparent; border: 1px solid rgba(58,44,34,.35); border-radius: 999px; padding: 10px 16px; cursor: pointer; transition: .2s; }
  .nav button:hover { background: var(--ink); color: var(--paper); }

  /* ---------- portada (tapa de cuero) ---------- */
  .sheet.cover {
    background:
      radial-gradient(500px 360px at 30% 20%, rgba(255,255,255,.07), transparent 70%),
      repeating-radial-gradient(circle at 70% 60%, rgba(0,0,0,.035) 0 1.5px, transparent 1.5px 4px),
      #4e4036;
    text-align: center; padding: 52px clamp(20px, 5vw, 56px) 40px; color: #efe6d8;
  }
  .cover .logo { width: min(300px, 70%); margin: 0 auto; mix-blend-mode: normal; }
  .cover .kicker { font: 500 13px/1 "Cinzel", serif; letter-spacing: .32em; text-transform: uppercase; color: #d9c08c; margin-top: 26px; }
  .index { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 26px; text-align: left; }
  .index button {
    display: flex; align-items: center; gap: 12px; cursor: pointer; transition: .2s;
    background: rgba(255,255,255,.06); border: 1px solid rgba(239,230,216,.3); border-radius: 4px;
    padding: 14px 16px; color: #f3ebdd;
  }
  .index button:hover { background: rgba(255,255,255,.14); transform: translateY(-2px); }
  .index svg { width: 28px; height: 28px; flex: 0 0 auto; color: #d9c08c; }
  .index span { font: 600 16px/1.15 "Cinzel", serif; font-variant: small-caps; letter-spacing: .04em; }
  .index small { display: block; font: italic 500 14px "Cormorant Garamond", serif; color: #cdbfa9; font-variant: normal; letter-spacing: 0; margin-top: 3px; }

  @media (max-width: 760px) {
    body { font-size: 16px; }
    .sheet { padding: 34px 18px 24px; }
    .r { grid-template-columns: 1fr !important; }
    .list.two { columns: 1; }
    .zig figure, .zig figure.rt { align-items: center; }
    .foot { flex-direction: column-reverse; }
    .tabs { justify-content: flex-start; }
    .r.rev > :first-child { order: 2; }
  }
  @media (prefers-reduced-motion: reduce) { .sheet.active { animation: none; } }
</style>
</head>

};
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const IMG = (n, w, alt = '') => `<img src="img/${n}.jpg" alt="${esc(alt)}" style="width:${w}px" loading="lazy">`;
const FIG = (n, w, alt, cap, cls = '') => `<figure class="${cls}">${IMG(n, w, alt)}${cap ? `<figcaption>${esc(cap)}</figcaption>` : ''}</figure>`;

function item([name, price, desc, tag]) {
  return `<li class="item"><div class="row"><span class="name">${esc(name)}${tag ? `<span class="tag">${esc(tag)}</span>` : ''}</span><span class="dots"></span><span class="price">${esc(price)}</span></div>${desc ? `<p class="desc">${esc(desc)}</p>` : ''}</li>`;
}
// grupo: título + lista (two = lista en 2 columnas, line = subrayado dorado)
function grp(h, items, o = {}) {
  return `<section class="group${o.tight ? ' tight' : ''}">${h ? `<h2${o.line ? ' class="line"' : ''}>${esc(h)}</h2>` : ''}${o.before || ''}<ul class="list${o.two ? ' two' : ''}">${items.map(item).join('')}</ul>${o.after || ''}</section>`;
}
// fila de composición: columnas CSS + celdas
const row = (cols, cells, cls = '') => `<div class="r ${cls}" style="grid-template-columns:${cols}">${cells.join('')}</div>`;

/* ============================================================
   RENDER
   ============================================================ */
const main = document.getElementById('main');
const tabs = document.getElementById('tabs');
const order = ['inicio', ...PAGES.map(p => p.id)];
const label = id => id === 'inicio' ? 'Inicio' : PAGES.find(p => p.id === id).short;

const footHTML = i => {
  const prev = order[i-1], next = order[i+1];
  return `<div class="foot"><div class="mini">HOY HAY<em>Café</em></div><div class="nav">
    ${prev ? `<button data-go="${prev}">← ${label(prev)}</button>` : ''}
    ${next ? `<button data-go="${next}">${label(next)} →</button>` : ''}</div></div>`;
};

main.insertAdjacentHTML('beforeend', `
<article class="sheet cover" id="p-inicio">
  <img class="logo" src="img/logo.png" alt="Hoy Hay Café">
  <p class="kicker">Catálogo</p>
  <div class="index">
    ${PAGES.map(p => `<button data-go="${p.id}">${ICONS[p.icon]}<span>${esc(p.title)}<small>${esc(p.sub)}</small></span></button>`).join('')}
  </div>
</article>`);

PAGES.forEach((p, i) => {
  const hasOrn = !p.left;
  main.insertAdjacentHTML('beforeend', `
  <article class="sheet" id="p-${p.id}">
    <header class="title${p.left ? ' left' : ''}"><h1>${esc(p.title)}</h1>${p.subtitle ? `<p class="sub">${esc(p.subtitle)}</p>` : ''}</header>
    <div class="orn${hasOrn ? '' : ' none'}">${ICONS[p.icon]}</div>
    ${p.html()}
    ${footHTML(i + 1)}
  </article>`);
});

tabs.insertAdjacentHTML('beforeend',
  `<button class="home" data-go="inicio" aria-label="Inicio">${ICONS.home}</button>` +
  PAGES.map(p => `<button data-go="${p.id}">${esc(p.short)}</button>`).join(''));

/* ---------- navegación: una hoja a la vez ---------- */
let current = 'inicio';
function show(id, push = true) {
  if (!order.includes(id)) id = 'inicio';
  document.querySelectorAll('.sheet').forEach(s => s.classList.toggle('active', s.id === 'p-' + id));
  tabs.querySelectorAll('button').forEach(b => b.dataset.go === id ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  const cur = tabs.querySelector('[aria-current]'); if (cur) cur.scrollIntoView({ inline: 'center', block: 'nearest' });
  window.scrollTo({ top: 0 });
  if (push) { try { history.replaceState(null, '', '#' + id); } catch (e) {} }
  current = id;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) show(b.dataset.go); });
window.addEventListener('hashchange', () => show(location.hash.slice(1), false));
document.addEventListener('keydown', e => {
  const i = order.indexOf(current);
  if (e.key === 'ArrowRight' && order[i+1]) show(order[i+1]);
  if (e.key === 'ArrowLeft' && order[i-1]) show(order[i-1]);
});
let x0 = null;
document.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0; x0 = null;
  const i = order.indexOf(current);
  if (Math.abs(dx) > 70) { if (dx < 0 && order[i+1]) show(order[i+1]); if (dx > 0 && order[i-1]) show(order[i-1]); }
}, { passive: true });

show(location.hash.slice(1) || 'inicio', false);
</script>
